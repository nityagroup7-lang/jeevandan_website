  <path d="M100 150 L100 182" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Red Stethoscope Accent -->
  <path d="M86 126 C86 148 114 148 114 126" fill="none" stroke="url(#stethGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M100 144 L100 158" fill="none" stroke="url(#stethGrad)" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="100" cy="162" r="5.5" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5" />
